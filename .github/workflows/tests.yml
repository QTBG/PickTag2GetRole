name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.7'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen python -m unittest discover -s tests -v
      - name: Build production image
        run: docker build -t picktag2getrole:test .
      - name: Test production image without external services
        run: docker run --rm picktag2getrole:test python -m unittest discover -s tests -v
