services:
  picktag2getrole:
    build: .
    container_name: picktag2getrole
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Pas de fichier de log dans le conteneur : stdout suffit,
      # la rotation est gérée par Docker (voir section logging)
      - LOG_FILE=
    volumes:
      # Monter le dossier de données pour la persistance
      - ./data:/app/data:rw
    # Limiter les ressources pour un VPS léger
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
